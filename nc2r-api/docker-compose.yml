# nc2r API - hardened single-service stack.
#
# Setup on the Docker server:
#   1. Add the environment variables in your stack (Portainer/Compose UI). The compose file passes the
#      needed ones (APP_KEY, DB_*, MAIL_*, FACEBOOK_*) into the containers by name. Other variables in
#      the stack are NOT passed into the containers. MEDIA_HOST_PATH is still read from .env for the volume path.
#   2. docker compose up -d --build
#   3. docker compose logs -f api   (check the health status with: docker compose ps)
#
# Database: the connection (DB_HOST, DB_DATABASE, DB_USERNAME, DB_PASSWORD...) comes from .env.
# Migrations are NOT run automatically; run them manually only when you need them:
#   docker compose exec api php artisan migrate --force

name: nc2r-api

services:
  api:
    build:
      # Built from the GitHub repo (nc2r-api folder on main), not from the local copy.
      context: https://github.com/carigcsu0-collab/techserve.git#main:nc2r-api
      dockerfile: Dockerfile
    image: nc2r-api:latest
    # Built locally from the Dockerfile, never pulled from a registry.
    pull_policy: build
    container_name: nc2r-api
    restart: unless-stopped

    # env_file:
    #   - path: .env
    #     required: true

    # These override .env so a copied production .env cannot leave debug/error pages on.
    # Values below come from the stack's environment variables (Portainer), passed through by name.
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_LEVEL: error
      QUEUE_CONNECTION: database
      APP_KEY: "${APP_KEY?Set APP_KEY in the stack environment}"
      APP_URL: "${APP_URL:-https://dtc-main-pc.tail9ac631.ts.net/app2}"
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: "${DB_HOST?Set DB_HOST in the stack environment}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE?Set DB_DATABASE in the stack environment}"
      DB_USERNAME: "${DB_USERNAME?Set DB_USERNAME in the stack environment}"
      DB_PASSWORD: "${DB_PASSWORD?Set DB_PASSWORD in the stack environment}"
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_HOST: "${MAIL_HOST:-127.0.0.1}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_SCHEME: "${MAIL_SCHEME:-}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-hello@example.com}"
      FACEBOOK_APP_ID: "${FACEBOOK_APP_ID:-}"
      FACEBOOK_APP_SECRET: "${FACEBOOK_APP_SECRET:-}"

    # Host port 8000 maps to the APP_URL in .env (http://localhost:8000).
    # To accept connections only from this machine, change this to "127.0.0.1:8000:80".
    ports:
      - "8050:80"

    # Hardening
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/lock
      - /var/www/html/bootstrap/cache:mode=0775,uid=33,gid=33
    volumes:
      # Lesson videos and images go to the separate HDD. Set MEDIA_HOST_PATH in .env,
      # e.g. MEDIA_HOST_PATH=D:/nc2r/uploads. The folder must exist (create_host_path is off on purpose).
      - type: bind
        source: ${MEDIA_HOST_PATH:?Set MEDIA_HOST_PATH in .env, e.g. D:/nc2r/uploads}
        target: /var/www/html/storage/app
        bind:
          create_host_path: false
      # Framework cache, sessions and logs stay in a Docker-managed volume.
      - nc2r-storage:/var/www/html/storage
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Converts uploaded videos to MP4 in the background (ffmpeg).
  # Same image and volumes as api, but runs as www-data with a PHP ini that allows
  # proc_open (needed by ffmpeg), and has no published ports.
  worker:
    build:
      # Built from the GitHub repo (nc2r-api folder on main), not from the local copy.
      context: https://github.com/carigcsu0-collab/techserve.git#main:nc2r-api
      dockerfile: Dockerfile
    image: nc2r-api:latest
    pull_policy: build
    container_name: nc2r-worker
    restart: unless-stopped
    depends_on:
      - api
    command: ["php", "artisan", "queue:work", "--tries=1", "--timeout=14400", "--sleep=3", "--memory=1024"]
    user: "33:33"

    # env_file:
    #   - path: .env
    #     required: true

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_LEVEL: error
      QUEUE_CONNECTION: database
      APP_KEY: "${APP_KEY?Set APP_KEY in the stack environment}"
      APP_URL: "${APP_URL:-https://dtc-main-pc.tail9ac631.ts.net/app2}"
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: "${DB_HOST?Set DB_HOST in the stack environment}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE?Set DB_DATABASE in the stack environment}"
      DB_USERNAME: "${DB_USERNAME?Set DB_USERNAME in the stack environment}"
      DB_PASSWORD: "${DB_PASSWORD?Set DB_PASSWORD in the stack environment}"
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_HOST: "${MAIL_HOST:-127.0.0.1}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_SCHEME: "${MAIL_SCHEME:-}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-hello@example.com}"

    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/www/html/bootstrap/cache:mode=0775,uid=33,gid=33
    volumes:
      - type: bind
        source: ${MEDIA_HOST_PATH:?Set MEDIA_HOST_PATH in .env, e.g. D:/nc2r/uploads}
        target: /var/www/html/storage/app
        bind:
          create_host_path: false
      - nc2r-storage:/var/www/html/storage
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  nc2r-storage:
