# nc2r API - hardened single-service stack.
#
# Setup on the Docker server:
#   1. Add the environment variables through your stack (Portainer/Compose UI). The compose file
#      does not load .env into the containers. MEDIA_HOST_PATH is still read from .env for the volume path.
#   2. docker compose up -d --build
#   3. docker compose logs -f api   (check the health status with: docker compose ps)
#
# Database: the connection (DB_HOST, DB_DATABASE, DB_USERNAME, DB_PASSWORD...) comes from .env.
# Migrations are NOT run automatically; run them manually only when you need them:
#   docker compose exec api php artisan migrate --force

name: nc2r-api

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: nc2r-api:latest
    container_name: nc2r-api
    restart: unless-stopped

    # env_file:
    #   - path: .env
    #     required: true

    # These override .env so a copied production .env cannot leave debug/error pages on.
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_LEVEL: error
      QUEUE_CONNECTION: database

    # Host port 8000 maps to the APP_URL in .env (http://localhost:8000).
    # To accept connections only from this machine, change this to "127.0.0.1:8000:80".
    ports:
      - "8050:80"

    # Hardening
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/lock
      - /var/www/html/bootstrap/cache:mode=0775,uid=33,gid=33
    volumes:
      # Lesson videos and images go to the separate HDD. Set MEDIA_HOST_PATH in .env,
      # e.g. MEDIA_HOST_PATH=D:/nc2r/uploads. The folder must exist (create_host_path is off on purpose).
      - type: bind
        source: ${MEDIA_HOST_PATH:?Set MEDIA_HOST_PATH in .env, e.g. D:/nc2r/uploads}
        target: /var/www/html/storage/app
        bind:
          create_host_path: false
      # Framework cache, sessions and logs stay in a Docker-managed volume.
      - nc2r-storage:/var/www/html/storage
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Converts uploaded videos to MP4 in the background (ffmpeg).
  # Same image and volumes as api, but runs as www-data with a PHP ini that allows
  # proc_open (needed by ffmpeg), and has no published ports.
  worker:
    image: nc2r-api:latest
    container_name: nc2r-worker
    restart: unless-stopped
    depends_on:
      - api
    command: ["php", "artisan", "queue:work", "--tries=1", "--timeout=14400", "--sleep=3", "--memory=1024"]
    user: "33:33"

    # env_file:
    #   - path: .env
    #     required: true

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_LEVEL: error
      QUEUE_CONNECTION: database

    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/www/html/bootstrap/cache:mode=0775,uid=33,gid=33
    volumes:
      - type: bind
        source: ${MEDIA_HOST_PATH:?Set MEDIA_HOST_PATH in .env, e.g. D:/nc2r/uploads}
        target: /var/www/html/storage/app
        bind:
          create_host_path: false
      - nc2r-storage:/var/www/html/storage
      - type: bind
        source: ./docker/php/worker.ini
        target: /usr/local/etc/php/conf.d/zz-worker.ini
        read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  nc2r-storage:
