expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
allow_url_include = Off
memory_limit = 256M

; Lesson videos: up to 2 GB per file. Uploads are streamed to disk, not held in memory.
; post_max_size must be larger than upload_max_filesize to allow for the form fields.
upload_max_filesize = 2G
post_max_size = 2100M
max_input_time = 3600
max_execution_time = 300
; Keep temp uploads on the HDD mount (storage/app/tmp), not the RAM-backed /tmp tmpfs.
; Same filesystem as storage/app/public, so the final move is a cheap rename.
upload_tmp_dir = /var/www/html/storage/app/tmp

; The API never needs to spawn shell commands; block them so an RCE bug cannot easily escalate.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec

session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

opcache.validate_timestamps = 0
